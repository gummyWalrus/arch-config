# ~/.config/hypr/hyprlock.conf
# Blade Runner 2049 themed lock screen
# Wallpaper: bladeRunner.jpg (1920x1200) — place it at ~/Pictures/wallpapers/bladeRunner.jpg
# and update the `path` line below if you put it somewhere else.

source    = ~/.config/hypr/colors-hyprlock.conf

# Color palette pulled from the image (burnt orange / amber haze)

general {
    hide_cursor = true
}

background {
    monitor =
    path = $wallpaper
    # blur_passes = 1
    # blur_size = 1
    # noise = 0.015
    contrast = 1.05
    brightness = 0.75
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

# Scrim panel behind the password field
shape {
    monitor =
    size = 460, 110
    color = $background
    rounding = 14
    border_size = 2PASSCODE
    border_color = $outline
    position = 0, -40
    halign = center
    valign = center
}

# --- CLOCK (upper portion, large) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 110
    font_family = Electroharmonix
    position = 0, 360
    halign = center
    valign = center
    # shadow_passes = 3
    # shadow_size = 6
    # shadow_color = $clock_shadow
    # shadow_boost = 1.2
}

# --- DATE (smaller, directly underneath the clock) ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y" | tr '[:lower:]' '[:upper:]')"
    color = $primary
    font_size = 22
    font_family = Electroharmonix
    position = 0, 290
    halign = center
    valign = center
    # shadow_passes = 2
    # shadow_size = 4
    # shadow_color = $clock_shadow
}

# --- PASSWORD FIELD (center, lower-middle height) ---
input-field {
    monitor =
    size = 420, 64
    outline_thickness = 2
    font_family = JetBrains Mono Nerds
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = $outline
    inner_color = $background
    font_color = $primary
    fade_on_empty = true
    fade_timeout = 500
    placeholder_text = 
    hide_input = false
    rounding = 12
    check_color = $inverse_primary
    fail_color = $error
    fail_text = <i>ACCESS DENIED</i>
    capslock_color = $outline
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -40
    halign = center
    valign = center
    dots_text_format = 
    # \udb82\udcc7
}

