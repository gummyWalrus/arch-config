# ~/.config/hypr/hyprlock.conf
# Blade Runner 2049 themed lock screen
# Wallpaper: bladeRunner.jpg (1920x1200) — place it at ~/Pictures/wallpapers/bladeRunner.jpg
# and update the `path` line below if you put it somewhere else.

source    = ~/.config/hypr/colors-hyprlock.conf

# Color palette pulled from the image (burnt orange / amber haze)

general {
    hide_cursor = true
}

background {
    monitor =
    path = $wallpaper
    # blur_passes = 1
    # blur_size = 1
    # noise = 0.015
    contrast = 1.05
    brightness = 0.75
    vibrancy = 0.18
    vibrancy_darkness = 0.2
}

# --- NEON PANEL (mirrors quickshell NeonRectangle: 1px border, 6px outer / 3px inner halo) ---
# Halo rings are 1px borders stepping out/in by 1px so they tile without
# overlapping; alphas follow NeonRectangle's cubic/quadratic falloff.
# Outer halo
shape {
    monitor =
    size = 462, 112
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_o1
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 464, 114
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_o2
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 466, 116
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_o3
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 468, 118
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_o4
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 470, 120
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_o5
    position = 0, -40
    halign = center
    valign = center
    zindex = 0
}

# Panel body
shape {
    monitor =
    size = 460, 110
    color = $background
    rounding = 0
    border_size = 1
    border_color = $primary
    position = 0, -40
    halign = center
    valign = center
    zindex = 1
}

# Inner halo
shape {
    monitor =
    size = 458, 108
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_i1
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}
shape {
    monitor =
    size = 456, 106
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_i2
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}
shape {
    monitor =
    size = 454, 104
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = $primary_glow_i3
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}

# --- CLOCK (upper portion, large) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 110
    font_family = Orbitron
    position = 0, 360
    halign = center
    valign = center
    # shadow_passes = 3
    # shadow_size = 6
    # shadow_color = $clock_shadow
    # shadow_boost = 1.2
}

# --- DATE (smaller, directly underneath the clock) ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y" | tr '[:lower:]' '[:upper:]')"
    color = $primary
    font_size = 22
    font_family = Orbitron
    position = 0, 290
    halign = center
    valign = center
    # shadow_passes = 2
    # shadow_size = 4
    # shadow_color = $clock_shadow
}

# --- PASSWORD FIELD (unstyled; sits inside the neon panel) ---
input-field {
    monitor =
    size = 420, 90
    outline_thickness = 0
    font_family = JetBrainsMono Nerd Font
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = $primary
    fade_on_empty = true
    fade_timeout = 500
    placeholder_text = 
    hide_input = false
    rounding = 0
    check_color = $inverse_primary
    fail_color = $error
    fail_text = <i>ACCESS DENIED</i>
    capslock_color = $outline
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -40
    halign = center
    valign = center
    zindex = 4
    dots_text_format = 
    # \udb82\udcc7
}

