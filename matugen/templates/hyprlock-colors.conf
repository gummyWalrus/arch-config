#- ~/.config/matugen/templates/hyprlock-colors.conf -#
#- Generates ~/.config/hypr/colors-hyprlock.conf — sourced from hyprlock.conf -#

$background = {{colors.surface.default.rgba}}
$primary = {{colors.primary.default.rgba}}
$inverse_primary = {{colors.inverse_primary.default.rgba}}
$on_primary = {{colors.on_primary.default.rgba}}
$container = {{colors.surface_container.default.rgba}}
$outline = {{colors.outline.default.rgba}}
$error = {{colors.error.default.rgba}}
$text = {{colors.on_surface.default.rgba}}

# NeonRectangle halo steps (glowRadius 6 / innerGlowRadius 3 / glowStrength 0.65)
$primary_glow_o1 = {{colors.primary.default.rgba | set_alpha: 0.41 }}
$primary_glow_o2 = {{colors.primary.default.rgba | set_alpha: 0.24 }}
$primary_glow_o3 = {{colors.primary.default.rgba | set_alpha: 0.12 }}
$primary_glow_o4 = {{colors.primary.default.rgba | set_alpha: 0.05 }}
$primary_glow_o5 = {{colors.primary.default.rgba | set_alpha: 0.015 }}
$primary_glow_i1 = {{colors.primary.default.rgba | set_alpha: 0.37 }}
$primary_glow_i2 = {{colors.primary.default.rgba | set_alpha: 0.16 }}
$primary_glow_i3 = {{colors.primary.default.rgba | set_alpha: 0.04 }}

$clock_shadow = {{colors.primary.default.rgba | set_lightness : 95 | set_alpha: 0.8 }}

$wallpaper = {{image}}
