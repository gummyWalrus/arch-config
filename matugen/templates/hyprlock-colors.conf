{#- Generates ~/.config/hypr/colors-hyprlock.conf — sourced from hyprlock.conf -#}

$background = {{colors.surface.default.rgba}}
$primary = {{colors.primary.default.rgba}}
$inverse_primary = {{colors.inverse_primary.default.rgba}}
$on_primary = {{colors.on_primary.default.rgba}}
$container = {{colors.surface_container.default.rgba}}
$outline = {{colors.outline.default.rgba}}
$error = {{colors.error.default.rgba}}
$text = {{colors.on_surface.default.rgba}}

$clock_shadow = {{colors.primary.default.rgba | set_lightness : 95 | set_alpha: 0.8 }}

$wallpaper = {{image}}
