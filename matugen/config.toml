# ~/.config/matugen/config.toml
#
# Matugen generates a Material You palette from your wallpaper, then writes
# it into every template listed below. Run:
#   matugen image /path/to/wallpaper.jpg
# to regenerate everything at once.

[config]
# hyprpaper has no built-in "set wallpaper" call the way swww does, so there's
# no [config.wallpaper] block here. Instead the hyprland template's post_hook
# below tells hyprpaper to load and switch to the new wallpaper.

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = '~/.config/matugen/scripts/reload-hyprpaper.sh "{{image}}"'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/colors-hyprlock.conf'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-theme.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = '~/.config/matugen/scripts/reload-kitty.sh'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = "pkill -x nautilus || true"

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.qml'
output_path = '~/.config/quickshell/lanicOS/colors/Colors.qml'

[templates.palette]
input_path = '~/.config/matugen/templates/palette.css'
output_path = '~/.config/matugen/current_palette.css'